name: Build

# Compiles the app for the iOS Simulator on every pull request,
# so broken code is caught before it reaches Varun's iPhone.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project StudyAbroad.xcodeproj \
            -target StudyAbroad \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        # UI tests need photos in the simulator, so CI runs the unit tests only (see docs/testing.md).
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE "iPhone[^(]*\([0-9A-F-]{36}\)" | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcodebuild test \
            -project StudyAbroad.xcodeproj \
            -scheme StudyAbroad \
            -destination "id=$UDID" \
            -only-testing:StudyAbroadTests \
            CODE_SIGNING_ALLOWED=NO
